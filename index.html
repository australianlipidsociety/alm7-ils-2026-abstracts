<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALM7 & 5th iLS | Live Interactive Book of Abstracts</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script src="config.js"></script>
<script src="data/snapshot.js"></script>
<script src="asset-data.js"></script>
<style>
:root{--navy:#0b3554;--teal:#1492a4;--bg:#152b3a;--line:#dce7ea;--muted:#667984}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy);overflow:hidden}
.topbar{height:64px;background:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px;box-shadow:0 2px 18px #10384f1d;position:relative;z-index:50}
.brand{height:42px;max-width:275px;object-fit:contain}.grow{flex:1}.mode-pill{font-size:11px;font-weight:800;padding:7px 10px;border-radius:16px;background:#e8f4f6;color:#0c7280;white-space:nowrap}.mode-pill.snapshot{background:#fff2d9;color:#936817}
.topbar button,.topbar a.pdf-link{border:0;border-radius:22px;padding:10px 15px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;font-size:13.3333px;line-height:normal;font-family:Arial,Helvetica,sans-serif}.topbar button.alt{background:var(--teal)}.topbar a.pdf-link{background:#5e7684;display:inline-block;white-space:nowrap}
.viewer{height:calc(100% - 64px);display:flex;align-items:safe center;justify-content:safe center;overflow:auto;position:relative;padding:10px;background:radial-gradient(circle at 50% 24%,#28485b 0,#173247 55%,#0d2332 100%)}
#flipbook{margin:auto}#flipbook canvas{display:block!important}.stf__parent{margin:auto!important;overflow:hidden!important}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:20;pointer-events:none}.loading-card{background:#fff;border-radius:24px;padding:22px 28px;box-shadow:0 14px 40px #10384f22;min-width:280px;text-align:center}.loading-card b{display:block;font-size:15px;margin-bottom:7px}.loading-card span{font-size:11px;color:var(--muted)}.loading-card .progress{display:block;margin-top:8px;color:var(--teal);font-weight:800}
.controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;z-index:60}.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:23px;cursor:pointer}.counter{background:#fff;border-radius:23px;padding:11px 16px;box-shadow:0 3px 16px #0002;font-weight:850;color:var(--navy)}
.zoom-controls{position:fixed;right:16px;bottom:14px;display:flex;align-items:center;gap:6px;z-index:62;background:#fff;border-radius:25px;padding:5px;box-shadow:0 3px 16px #0002}.zoom-controls button{width:36px;height:36px;border:0;border-radius:50%;background:#eef4f6;color:var(--navy);font-size:20px;font-weight:900;cursor:pointer;line-height:1}.zoom-value{min-width:54px;text-align:center;font-size:12px;font-weight:850;color:var(--navy);cursor:pointer;user-select:none}
.drawer{position:fixed;top:64px;right:0;width:min(410px,94vw);height:calc(100% - 64px);background:#fff;z-index:70;padding:24px;box-shadow:-10px 0 30px #0b2c3d20;transform:translateX(105%);transition:.25s;overflow:auto}.drawer.open{transform:none}.drawer .close{float:right;border:0;background:none;font-size:24px;color:var(--navy);cursor:pointer}.drawer h2{font-size:28px;margin:10px 0 20px}.drawer h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:22px 0 5px}.drawer button.jump{width:100%;display:grid;grid-template-columns:1fr 42px;gap:12px;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--navy);font-size:11px;cursor:pointer}.drawer button.jump.small{font-size:9.5px;color:var(--muted);padding-left:8px}.drawer button.jump b{color:var(--teal);text-align:right}
.fallback{position:relative;width:min(595px,92vw);aspect-ratio:595/842;margin:auto;background:#fff}.fallback img{width:100%;height:100%;object-fit:contain;display:block}
.crisp-overlay{position:absolute;inset:0;z-index:54;pointer-events:none;display:block}.crisp-overlay img{position:absolute;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}.link-overlay{position:absolute;inset:0;z-index:55;pointer-events:none}.link-overlay button{position:absolute;border:0;background:transparent;padding:0;margin:0;pointer-events:auto;cursor:pointer}
@media(max-width:760px){.brand{max-width:150px}.mode-pill{display:none}.topbar button,.topbar a.pdf-link{padding:9px 11px;font-size:12px}.controls{bottom:7px}.zoom-controls{right:8px;bottom:60px}.zoom-controls button{width:32px;height:32px}.zoom-value{min-width:48px;font-size:11px}}
</style>
</head>
<body>
<div class="topbar"><img class="brand" src="assets/conference-logo-transparent.png" alt="ALM7 and 5th iLS Conference"><span class="mode-pill" id="dataMode">Connecting…</span><div class="grow"></div><a class="pdf-link" href="ALM7_5th_iLS_Book_of_Abstracts.pdf" target="_blank" rel="noopener" aria-label="Open static PDF version">PDF</a><button class="alt" id="contentsBtn" type="button">Contents</button><button id="firstBtn" type="button">Cover</button></div>
<div class="viewer"><div id="flipbook"></div><div id="crispOverlay" class="crisp-overlay" aria-hidden="true"></div><div id="linkOverlay" class="link-overlay" aria-hidden="true"></div><div class="loading" id="loading"><div class="loading-card"><b>Assembling the live lipidome…</b><span id="loadingText">Arranging the lipid layers</span><span class="progress" id="progress"></span></div></div></div>
<div class="controls"><button class="round" id="prevBtn" aria-label="Previous page" type="button">‹</button><div class="counter"><span id="current">—</span> / <span id="total">—</span></div><button class="round" id="nextBtn" aria-label="Next page" type="button">›</button></div>
<div class="zoom-controls" aria-label="Book zoom"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><span class="zoom-value" id="zoomValue" title="Reset zoom">100%</span><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div>
<aside class="drawer" id="drawer"><button class="close" id="closeDrawer" type="button">×</button><h2>Contents</h2><div id="drawerContents"></div></aside>
<script src="app.js"></script>
</body>
</html>
