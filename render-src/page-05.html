<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.lead{position:absolute;left:48px;top:49px;width:450px}.lead .display{font-size:44px;margin-top:18px}.lead .rule{margin-top:18px}
.tiers{position:absolute;left:54px;right:54px;top:182px}
.tier{margin-top:13px}.tier-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}.tier-head:before,.tier-head:after{content:"";height:2px;background:currentColor;flex:1}.tier-head span{font-size:10px;font-weight:900}.platinum{color:#4d87df}.gold{color:#d7a72e}.silver{color:#99a7b6}.bronze{color:#bc6e2f}.teal{color:#2cb5c7}.coral{color:#d9805d}

.silver-top{position:absolute;left:18px;right:18px;top:14px;display:flex;align-items:center;justify-content:space-between}.silver-top img{width:auto;height:auto;object-fit:contain}.silver-top img:nth-child(1){max-width:126px;max-height:48px}.silver-top img:nth-child(2){max-width:92px;max-height:38px}.silver-top img:nth-child(3){max-width:146px;max-height:50px}.silver-bottom{position:absolute;left:0;right:0;bottom:10px;display:flex;align-items:center;justify-content:center;gap:60px}.silver-bottom img{width:auto;height:auto;object-fit:contain}.silver-bottom img:nth-child(1){max-width:102px;max-height:48px}.silver-bottom img:nth-child(2){max-width:104px;max-height:48px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:14px}.mini-card{height:78px;border:1px solid #bdd0da;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 28px}.awards img:first-child{height:36px;width:auto;max-width:116px;object-fit:contain}.awards img:last-child{height:28px;width:auto;max-width:102px;object-fit:contain}.event img{width:124px;max-height:48px;object-fit:contain}
.footer{left:48px;right:48px}
</style></head><body><div class="page sponsors">

</div><div class="footer"><span>Our Sponsors</span><b>05</b></div>
